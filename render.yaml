services:
  # Backend Web Service
  - type: web
    name: placement-compass-api
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

  # Frontend Static Site
  - type: static
    name: placement-compass-web
    env: node
    buildCommand: npm install && npm run build
    staticPublishDir: dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: placement-compass-api
          property: host
    rewriteRules:
      - source: /*
        destination: /index.html
