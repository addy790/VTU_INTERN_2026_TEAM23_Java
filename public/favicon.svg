<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dynamic gradient to match the application's Maroon theme -->
  <defs>
    <linearGradient id="g-maroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800000" />
      <stop offset="100%" stop-color="#3d0000" />
    </linearGradient>
  </defs>
  
  <!-- Outer rounded square -->
  <rect width="100" height="100" rx="25" fill="url(#g-maroon)" />
  
  <!-- "P" logo representing Placement / PAT -->
  <text x="50%" y="54%" font-family="system-ui, -apple-system, blinkmacsystemfont, 'Segoe UI', roboto, sans-serif" font-size="64" font-weight="800" font-style="normal" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" letter-spacing="-2">
    P
  </text>
  
  <!-- A little sparkle / highlight in the corner to match the high quality design -->
  <circle cx="80" cy="20" r="4" fill="#ffffff" opacity="0.6" />
</svg>
